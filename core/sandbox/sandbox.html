<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-eval' 'unsafe-inline' blob: https://esm.sh;">
</head>
<body>
<script type="module">
    window.addEventListener("message", async e => {
        console.log("Hello from sandbox!");
        let iframe_port = e.ports[0];
        const code = e.data;
        const logs = [];
        let url;
        try {
            const origlog = console.debug;
            // intercept logs
            const log = (...args) => {
                origlog("[dlPro sandbox]", ...args);
                logs.push(args.join(" "))
            };
            console.log = log;
            console.warn = log;
            console.error = log;

            // run AS A MODULE
            const blob = new Blob([code], {type: 'text/javascript'})
            url = URL.createObjectURL(blob)
            await import(url)
        } finally {
            URL.revokeObjectURL(url)
            iframe_port.postMessage(logs.join("\n"));
        }
    });
</script>
</body>
</html>
