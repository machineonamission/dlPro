<!DOCTYPE html>
<html>
<body>
<script>
    window.addEventListener("message", e => {
        const code = e.data;
        const logs = [];
        try {
            console.log = (...args) => logs.push(args.join(" "));
            new Function(code)();
        } finally {
            e.source.postMessage({ output: logs.join("\n") });
        }
    });
</script>
</body>
</html>
